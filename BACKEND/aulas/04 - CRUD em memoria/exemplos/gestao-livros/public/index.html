<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biblioteca · Livros</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1>Biblioteca</h1>
        <p class="subtitle">Consulte, adicione, edite e remova livros.</p>
      </header>

      <section class="busca">
        <input
          id="campoBusca"
          type="text"
          placeholder="Buscar por nome do livro..."
          autocomplete="off"
        />
        <button id="btnBuscar" class="btn">Buscar</button>
      </section>

      <section class="add">
        <button id="btnMostrarForm" class="btn btn-secundario">
          + Adicionar livro
        </button>

        <form id="formAdicionar" class="form-add hidden">
          <div class="campo">
            <label for="novoTitulo">Título</label>
            <input id="novoTitulo" type="text" required />
          </div>
          <div class="campo">
            <label for="novoAutor">Autor</label>
            <input id="novoAutor" type="text" required />
          </div>
          <div class="form-acoes">
            <button type="submit" class="btn">Salvar</button>
            <button type="button" id="btnCancelarAdd" class="btn btn-texto">
              Cancelar
            </button>
          </div>
        </form>
      </section>

      <p id="status" class="status" role="status"></p>

      <div id="resultado" class="resultado"></div>
    </main>

    <div id="modalEditar" class="modal-overlay hidden">
      <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitulo"
      >
        <h2 id="modalTitulo">Editar livro</h2>
        <div class="campo">
          <label for="editTitulo">Título</label>
          <input id="editTitulo" type="text" required />
        </div>
        <div class="campo">
          <label for="editAutor">Autor</label>
          <input id="editAutor" type="text" required />
        </div>
        <div class="form-acoes">
          <button id="btnAtualizar" class="btn">Atualizar</button>
          <button id="btnCancelarEdit" class="btn btn-texto">Cancelar</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
